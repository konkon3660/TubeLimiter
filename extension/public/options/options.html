<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="options_page_title"></title>
    <link rel="stylesheet" href="/assets/common.css" />
    <link rel="stylesheet" href="/assets/gamify.css" />
    <style>
      html {
        background: var(--light-gray);
        min-height: 100%;
      }

      body {
        width: auto;
        max-width: 760px;
        margin: 24px auto;
        padding-bottom: 0;
        background: transparent;
        font-size: 15px;
      }

      body > .header {
        max-width: 760px;
        margin: 0 auto 16px;
        border-radius: 14px;
        box-shadow: var(--shadow-lg);
        font-size: 1.3em;
        padding: 18px 20px;
      }

      #signedOutView,
      #signedInView,
      #accountDeletedView {
        max-width: 760px;
        margin: 0 auto;
      }

      #signedOutView .auth-box,
      #accountDeletedView .auth-box {
        background: var(--bg-color);
        border-radius: 14px;
        box-shadow: var(--shadow-lg);
      }

      #signedInView {
        padding: 0 !important;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      #signedInView .control-section {
        margin: 0;
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 18px 20px;
      }

      #signedInView .wide-section {
        grid-column: 1 / -1;
      }

      #signedInView .control-section h4 {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 1.05em;
        padding-bottom: 12px;
        margin-bottom: 16px;
        border-bottom: 1px solid var(--border-color);
      }

      /* form rows: label on top, input below — reads better at desktop width */
      .field-row {
        margin-bottom: 14px;
      }
      .field-row:last-child {
        margin-bottom: 0;
      }
      .field-row > label {
        display: block;
        font-size: 0.85em;
        font-weight: 600;
        color: var(--gray);
        margin-bottom: 6px;
      }
      .field-row input[type='number'],
      .field-row select {
        width: 100%;
        padding: 9px 11px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        background: var(--card-bg);
        color: var(--dark-gray);
        font-size: 0.95em;
      }
      .field-row input:focus,
      .field-row select:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        outline: none;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.92em;
        font-weight: 500;
        cursor: pointer;
      }
      .checkbox-row input {
        width: auto;
        margin: 0;
      }

      .day-limit-row {
        display: grid;
        grid-template-columns: 72px 1fr;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }
      .day-limit-row label {
        width: auto;
        font-size: 0.9em;
        color: var(--gray);
        font-weight: 500;
      }
      .day-limit-row input {
        width: 100%;
        padding: 7px 9px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        background: var(--card-bg);
        color: var(--dark-gray);
      }

      .whitelist-item {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      .whitelist-item input {
        flex: 1;
        width: auto;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        background: var(--card-bg);
        color: var(--dark-gray);
      }
      .whitelist-item button {
        width: auto;
        flex: none;
        margin-top: 0;
        padding: 8px 14px;
        white-space: nowrap;
      }
      .whitelist-item button[data-remove] {
        background: rgba(239, 68, 68, 0.1);
        color: var(--danger-color);
        border: 1px solid rgba(239, 68, 68, 0.2);
      }
      .whitelist-item button[data-remove]:hover {
        background: rgba(239, 68, 68, 0.18);
      }
      #whitelistList:empty::after {
        content: attr(data-empty);
        display: block;
        font-size: 0.85em;
        color: var(--gray);
        padding: 8px 0;
      }
      /* 거부된 입력과 "효력 없는 옛 항목" 안내. 둘 다 같은 톤으로 - 사용자가 고쳐야 할 값이다. */
      .whitelist-invalid {
        flex-basis: 100%;
        margin: 4px 0 0;
        font-size: 0.85em;
        color: var(--danger, #c0392b);
      }
      .hint {
        margin: 8px 0 0;
        font-size: 0.85em;
        color: var(--gray);
      }

      .schedule-item {
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 10px;
        background: var(--card-bg);
      }
      .schedule-item-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .schedule-item-header .schedule-label {
        flex: 1;
        width: auto;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        background: var(--bg-color);
        color: var(--dark-gray);
      }
      .schedule-item-header .schedule-enabled-toggle {
        white-space: nowrap;
        font-size: 0.85em;
      }
      .schedule-item-header button {
        width: auto;
        flex: none;
        margin-top: 0;
        padding: 8px 14px;
        white-space: nowrap;
        background: rgba(239, 68, 68, 0.1);
        color: var(--danger-color);
        border: 1px solid rgba(239, 68, 68, 0.2);
      }
      .schedule-item-header button:hover {
        background: rgba(239, 68, 68, 0.18);
      }
      .schedule-days {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }
      .day-toggle-chip {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 0.82em;
        color: var(--gray);
        border: 1px solid var(--border-color);
        border-radius: 999px;
        padding: 4px 10px;
        cursor: pointer;
      }
      .day-toggle-chip input {
        width: auto;
        margin: 0;
      }
      .schedule-times {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .schedule-times input[type='time'] {
        padding: 7px 9px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        background: var(--bg-color);
        color: var(--dark-gray);
      }
      #scheduleList:empty::after {
        content: attr(data-empty);
        display: block;
        font-size: 0.85em;
        color: var(--gray);
        padding: 8px 0;
      }

      .save-bar {
        grid-column: 1 / -1;
        position: sticky;
        bottom: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        box-shadow: var(--shadow-lg);
        padding: 14px 20px;
      }
      .save-bar #saveButton {
        width: auto;
        margin: 0;
        padding: 10px 28px;
      }
      .save-bar #saveStatus {
        margin: 0;
      }
      .save-bar #signOutButton {
        width: auto;
        margin: 0 0 0 auto;
        padding: 10px 20px;
      }

      /* 진단: 평소엔 접혀 있고, 펼치면 실패 목록이 등폭 글꼴로 한 줄씩 보인다.
       <details>라 .control-section의 h4 스타일을 못 쓰므로 summary에 같은 모양을 준다. */
      #signedInView .diagnostics-section > summary {
        cursor: pointer;
        font-weight: 600;
        font-size: 1.02em;
        color: var(--dark-gray);
        list-style-position: inside;
      }
      .diagnostics-summary {
        margin-top: 12px;
        font-size: 0.92em;
        color: var(--dark-gray);
      }
      .diagnostics-list {
        margin-top: 10px;
        max-height: 260px;
        overflow-y: auto;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--card-bg);
      }
      .diagnostics-list:empty {
        display: none;
      }
      .diagnostics-row {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 7px 10px;
        font-size: 0.85em;
        border-bottom: 1px solid var(--border-color);
      }
      .diagnostics-row:last-child {
        border-bottom: none;
      }
      .diagnostics-row .diag-time {
        font-family: monospace;
        color: var(--gray);
        white-space: nowrap;
      }
      .diagnostics-row .diag-kind {
        font-weight: 600;
        white-space: nowrap;
      }
      .diagnostics-row .diag-code {
        font-family: monospace;
        color: var(--dark-gray);
        word-break: break-all;
      }
      .diagnostics-row .diag-count {
        margin-left: auto;
        color: var(--warning-color);
        white-space: nowrap;
      }
      .diagnostics-empty {
        padding: 10px;
        font-size: 0.88em;
        color: var(--gray);
      }
      .diagnostics-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
      }

      /* 위험 구역: 실수로 누르기 어렵도록 본문과 확실히 구분되게 칠한다 */
      #signedInView .danger-section {
        border-color: rgba(239, 68, 68, 0.35);
        background: rgba(239, 68, 68, 0.03);
      }
      #signedInView .danger-section h4 {
        color: var(--danger-color);
      }
      .danger-list {
        margin: 10px 0 14px;
        padding-left: 20px;
        font-size: 0.88em;
        color: var(--dark-gray);
      }
      .danger-list li {
        margin-bottom: 4px;
      }
      .danger-confirm-phrase {
        font-family: monospace;
        font-size: 0.95em;
        color: var(--danger-color);
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 7px 10px;
        margin-bottom: 8px;
        word-break: break-all;
      }
      .danger-section input[type='text'] {
        width: 100%;
        padding: 9px 11px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        background: var(--card-bg);
        color: var(--dark-gray);
        font-size: 0.95em;
      }
      .danger-section input[type='text']:focus {
        border-color: var(--danger-color);
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        outline: none;
      }
      .danger-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .danger-section button:disabled {
        background: var(--gray);
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }

      @media (max-width: 680px) {
        body {
          margin: 0;
          font-size: 14px;
        }
        body > .header {
          margin: 0 0 12px;
          border-radius: 0;
        }
        #signedInView {
          grid-template-columns: 1fr;
          padding: 0 12px !important;
        }
        #signedOutView,
        #accountDeletedView {
          padding: 0 12px;
        }
        .save-bar {
          position: static;
          flex-wrap: wrap;
        }
        .save-bar #signOutButton {
          margin-left: 0;
        }
        /* 16px 미만 인풋은 iOS Safari에서 포커스 시 자동 확대됨 */
        .field-row input[type='number'],
        .field-row select,
        .day-limit-row input,
        .whitelist-item input,
        .danger-section input[type='text'] {
          font-size: 16px;
        }
      }

      @media (max-width: 420px) {
        #signedInView .control-section {
          padding: 16px;
        }
        .day-limit-row {
          grid-template-columns: 60px 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div style="position: relative; z-index: 1" data-i18n="options_header"></div>
    </div>

    <div id="signedOutView" style="display: none">
      <div class="auth-box">
        <p data-i18n="options_signed_out_desc"></p>
        <button id="openAuthButton" class="btn-primary" data-i18n="action_sign_in_or_up"></button>
      </div>
    </div>

    <div id="signedInView" style="display: none">
      <div class="control-section">
        <h4 data-i18n="options_section_daily_limit"></h4>
        <div class="field-row">
          <label class="checkbox-row"
            ><input type="checkbox" id="byDayToggle" />
            <span data-i18n="options_by_day_toggle"></span
          ></label>
        </div>
        <div id="simpleLimitBlock" class="field-row">
          <label for="dailyLimitInput" data-i18n="options_daily_limit_label"></label>
          <input type="number" id="dailyLimitInput" min="0" value="30" />
        </div>
        <div id="byDayLimitBlock" style="display: none">
          <div class="day-limit-row" data-day="0">
            <label data-i18n="weekday_sunday"></label><input type="number" min="-1" />
          </div>
          <div class="day-limit-row" data-day="1">
            <label data-i18n="weekday_monday"></label><input type="number" min="-1" />
          </div>
          <div class="day-limit-row" data-day="2">
            <label data-i18n="weekday_tuesday"></label><input type="number" min="-1" />
          </div>
          <div class="day-limit-row" data-day="3">
            <label data-i18n="weekday_wednesday"></label><input type="number" min="-1" />
          </div>
          <div class="day-limit-row" data-day="4">
            <label data-i18n="weekday_thursday"></label><input type="number" min="-1" />
          </div>
          <div class="day-limit-row" data-day="5">
            <label data-i18n="weekday_friday"></label><input type="number" min="-1" />
          </div>
          <div class="day-limit-row" data-day="6">
            <label data-i18n="weekday_saturday"></label><input type="number" min="-1" />
          </div>
          <div class="input-hint" data-i18n="options_by_day_hint"></div>
        </div>
        <div class="field-row" style="margin-top: 14px">
          <label for="shortsLimitInput" data-i18n="options_shorts_limit_label"></label>
          <input type="number" id="shortsLimitInput" min="0" value="0" />
          <div class="input-hint" data-i18n="options_shorts_limit_hint"></div>
        </div>
        <div
          id="limitLockHint"
          class="input-hint"
          style="display: none; margin-top: 8px; color: var(--danger-color)"
          data-i18n="options_limit_lock_hint"
        ></div>
      </div>

      <div class="control-section">
        <h4 data-i18n="options_section_hardcore"></h4>
        <div id="hardcoreOffBlock" class="field-row">
          <div class="input-hint" data-i18n="options_hardcore_off_hint"></div>
          <button
            type="button"
            id="enableHardcoreButton"
            class="btn-primary"
            style="margin-top: 8px; width: auto"
            data-i18n="options_hardcore_enable"
          ></button>
        </div>
        <div id="hardcoreOnBlock" class="field-row" style="display: none">
          <div class="input-hint" data-i18n="options_hardcore_on_hint"></div>
          <button
            type="button"
            id="requestHardcoreOffButton"
            class="btn-secondary"
            style="margin-top: 8px; width: auto"
            data-i18n="options_hardcore_request_off"
          ></button>
        </div>
        <div id="hardcorePendingBlock" class="field-row" style="display: none">
          <!-- 실제 남은 시간은 options.js가 1초마다 다시 채운다. -->
          <div
            class="input-hint"
            id="hardcorePendingText"
            data-i18n="options_hardcore_pending_label"
          ></div>
          <button
            type="button"
            id="cancelHardcoreOffButton"
            class="btn-secondary"
            style="margin-top: 8px; width: auto"
            data-i18n="options_hardcore_cancel_off"
          ></button>
        </div>
        <div class="field-row">
          <label class="checkbox-row"
            ><input type="checkbox" id="alwaysBlockShortsToggle" />
            <span data-i18n="options_always_block_shorts"></span
          ></label>
        </div>
      </div>

      <div class="control-section">
        <h4 data-i18n="options_section_alarms"></h4>
        <div class="field-row">
          <label for="alarmIntervalInput" data-i18n="options_alarm_interval_label"></label>
          <input type="number" id="alarmIntervalInput" min="0" value="0" />
        </div>
        <label class="checkbox-row"
          ><input type="checkbox" id="alarmMilestonesToggle" />
          <span data-i18n="options_alarm_milestones_label"></span
        ></label>
      </div>

      <div class="control-section">
        <h4 data-i18n="options_section_emergency"></h4>
        <div class="field-row">
          <label for="emergencyUsesInput" data-i18n="options_emergency_uses_label"></label>
          <input type="number" id="emergencyUsesInput" min="0" value="3" />
        </div>
        <div class="field-row">
          <label for="emergencyResetSelect" data-i18n="options_emergency_reset_label"></label>
          <select id="emergencyResetSelect">
            <option value="daily" data-i18n="options_reset_daily"></option>
            <option value="weekly" data-i18n="options_reset_weekly"></option>
            <option value="monthly" data-i18n="options_reset_monthly"></option>
          </select>
        </div>
      </div>

      <div class="control-section wide-section">
        <h4 data-i18n="options_section_whitelist"></h4>
        <div id="whitelistList" data-i18n-empty="options_whitelist_empty"></div>
        <div class="whitelist-item">
          <input
            type="text"
            id="whitelistInput"
            data-i18n-placeholder="options_whitelist_placeholder"
            placeholder=""
          />
          <button id="addWhitelistButton" class="btn-secondary" data-i18n="action_add"></button>
        </div>
        <p id="whitelistError" class="whitelist-invalid" style="display: none"></p>
        <p class="hint" data-i18n="options_whitelist_hint"></p>
      </div>

      <div class="control-section wide-section">
        <h4 data-i18n="options_section_schedule"></h4>
        <div class="input-hint" style="margin-bottom: 10px" data-i18n="options_schedule_hint"></div>
        <div id="scheduleList" data-i18n-empty="options_schedule_empty"></div>
        <button
          type="button"
          id="addScheduleButton"
          class="btn-secondary"
          style="width: auto"
          data-i18n="options_schedule_add"
        ></button>
      </div>

      <!-- 동기화·인증 실패는 서비스워커 콘솔에만 남는데 MV3 서비스워커는 유휴 상태면 죽어서
         콘솔도 같이 날아간다. 그래서 최근 실패를 기기 안에 쌓아두고 여기서 그대로 보여준다.
         평소엔 볼 일이 없으니 <details>로 접어둔다. -->
      <details class="control-section wide-section diagnostics-section" id="diagnosticsSection">
        <summary data-i18n="options_section_diagnostics"></summary>
        <div class="input-hint" style="margin-top: 10px" data-i18n="options_diagnostics_hint"></div>
        <div class="diagnostics-summary">
          <span data-i18n="options_diagnostics_last_success_label"></span>
          <strong id="diagnosticsLastSuccess" data-i18n="common_loading"></strong>
        </div>
        <div id="diagnosticsList" class="diagnostics-list"></div>
        <div class="diagnostics-actions">
          <button
            type="button"
            id="refreshDiagnosticsButton"
            class="btn-secondary"
            style="width: auto"
            data-i18n="action_refresh"
          ></button>
          <button
            type="button"
            id="copyDiagnosticsButton"
            class="btn-secondary"
            style="width: auto"
            data-i18n="action_copy"
          ></button>
          <button
            type="button"
            id="clearDiagnosticsButton"
            class="btn-secondary"
            style="width: auto"
            data-i18n="action_clear"
          ></button>
        </div>
        <div id="diagnosticsStatus" class="input-hint" style="margin-top: 8px"></div>
      </details>

      <div class="save-bar">
        <button id="saveButton" class="btn-primary" data-i18n="action_save"></button>
        <div id="saveStatus" class="input-hint"></div>
        <button id="signOutButton" class="btn-secondary" data-i18n="action_sign_out"></button>
      </div>

      <div class="control-section wide-section danger-section">
        <h4 data-i18n="options_section_danger"></h4>
        <div class="input-hint">
          <span data-i18n="options_danger_desc"></span>
          <strong data-i18n="options_danger_irreversible"></strong>
        </div>
        <ul class="danger-list">
          <li data-i18n="options_danger_item_account"></li>
          <li data-i18n="options_danger_item_usage"></li>
          <li data-i18n="options_danger_item_streak"></li>
          <li data-i18n="options_danger_item_badges"></li>
          <li data-i18n="options_danger_item_settings"></li>
        </ul>
        <button
          type="button"
          id="deleteAccountButton"
          class="btn-danger"
          style="width: auto"
          data-i18n="options_delete_account"
        ></button>

        <div
          id="deleteAccountConfirmBlock"
          class="field-row"
          style="display: none; margin-top: 16px"
        >
          <label for="deleteAccountConfirmInput" data-i18n="options_delete_confirm_label"></label>
          <div class="danger-confirm-phrase" id="deleteAccountPhrase"></div>
          <input type="text" id="deleteAccountConfirmInput" autocomplete="off" spellcheck="false" />
          <div class="danger-actions">
            <button
              type="button"
              id="confirmDeleteAccountButton"
              class="btn-danger"
              style="width: auto"
              disabled
              data-i18n="options_delete_permanently"
            ></button>
            <button
              type="button"
              id="cancelDeleteAccountButton"
              class="btn-secondary"
              style="width: auto"
              data-i18n="action_cancel"
            ></button>
          </div>
        </div>

        <div id="deleteAccountStatus" class="input-hint" style="margin-top: 10px"></div>
      </div>
    </div>

    <div id="accountDeletedView" style="display: none">
      <div class="auth-box">
        <p data-i18n="options_account_deleted_title"></p>
        <div class="input-hint" data-i18n="options_account_deleted_hint"></div>
        <button
          id="deletedSignUpButton"
          class="btn-primary"
          style="margin-top: 12px"
          data-i18n="action_sign_in_or_up"
        ></button>
