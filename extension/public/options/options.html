<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TubeLimiter 설정</title>
  <link rel="stylesheet" href="/assets/common.css">
  <link rel="stylesheet" href="/assets/gamify.css">
  <style>
    body { width: auto; max-width: 560px; margin: 0 auto; padding-bottom: 40px; }
    .day-limit-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .day-limit-row label { width: 60px; }
    .whitelist-item { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    .whitelist-item input { flex: 1; }
  </style>
</head>
<body>
  <div class="header"><div style="position: relative; z-index: 1;">⚙️ TubeLimiter 설정</div></div>

  <div id="signedOutView" style="display:none;">
    <div class="auth-box">
      <p>설정을 저장하려면 먼저 로그인하세요.</p>
      <button id="openAuthButton" class="btn-primary">로그인 / 회원가입</button>
    </div>
  </div>

  <div id="signedInView" style="display:none; padding: 16px;">
    <div class="control-section">
      <h4>⏱️ 일일 시청 제한</h4>
      <div class="input-group">
        <label><input type="checkbox" id="byDayToggle"> 요일별로 다르게 설정</label>
      </div>
      <div id="simpleLimitBlock" class="input-group">
        <label for="dailyLimitInput">하루 제한(분, 0=무제한):</label>
        <input type="number" id="dailyLimitInput" min="0" value="30">
      </div>
      <div id="byDayLimitBlock" style="display:none;">
        <div class="day-limit-row" data-day="0"><label>일요일</label><input type="number" min="-1"></div>
        <div class="day-limit-row" data-day="1"><label>월요일</label><input type="number" min="-1"></div>
        <div class="day-limit-row" data-day="2"><label>화요일</label><input type="number" min="-1"></div>
        <div class="day-limit-row" data-day="3"><label>수요일</label><input type="number" min="-1"></div>
        <div class="day-limit-row" data-day="4"><label>목요일</label><input type="number" min="-1"></div>
        <div class="day-limit-row" data-day="5"><label>금요일</label><input type="number" min="-1"></div>
        <div class="day-limit-row" data-day="6"><label>토요일</label><input type="number" min="-1"></div>
        <div class="input-hint">-1 = 그 요일은 무제한</div>
      </div>
    </div>

    <div class="control-section">
      <h4>🚫 Shorts</h4>
      <label><input type="checkbox" id="alwaysBlockShortsToggle"> YouTube Shorts 항상 차단</label>
    </div>

    <div class="control-section">
      <h4>📋 화이트리스트</h4>
      <div id="whitelistList"></div>
      <div class="whitelist-item">
        <input type="text" id="whitelistInput" placeholder="URL 또는 채널 일부 문자열">
        <button id="addWhitelistButton" class="btn-secondary">추가</button>
      </div>
    </div>

    <div class="control-section">
      <h4>🆘 긴급 시청</h4>
      <div class="input-group">
        <label for="emergencyUsesInput">횟수:</label>
        <input type="number" id="emergencyUsesInput" min="0" value="3">
      </div>
      <div class="input-group">
        <label for="emergencyResetSelect">초기화 주기:</label>
        <select id="emergencyResetSelect">
          <option value="daily">매일</option>
          <option value="weekly">매주</option>
          <option value="monthly">매월</option>
        </select>
      </div>
    </div>

    <button id="saveButton" class="btn-primary">저장</button>
    <div id="saveStatus" class="input-hint"></div>
  </div>

  <script src="/options/options.js" type="module"></script>
</body>
</html>
