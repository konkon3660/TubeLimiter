<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TubeLimiter</title>
  <link rel="stylesheet" href="/assets/common.css">
  <link rel="stylesheet" href="/assets/popup_animations.css">
  <link rel="stylesheet" href="/assets/gamify.css">
  <style>
    /* 동기화 지연 경고. 공용 CSS(assets/common.css)에 넣지 않고 여기 둔 이유는 이 한 줄이
       팝업 전용이기 때문이다. 경고색(빨강)이 아니라 주의색(주황)에 옅은 배경 — 사용자가
       지금 뭘 잘못한 게 아니라 그냥 알려주는 것이라 시선을 뺏지 않아야 한다. */
    .sync-warning {
      margin: 0 0 10px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(245, 158, 11, 0.35);
      background: rgba(245, 158, 11, 0.08);
      color: var(--warning-color);
      font-size: 0.82em;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="header"><div style="position: relative; z-index: 1;">🎯 TubeLimiter</div></div>

  <div id="signedOutView" style="display:none;">
    <div class="auth-box">
      <p>계정에 로그인하면 스트릭/XP가 기기 간에 동기화됩니다.</p>
      <button id="openAuthButton" class="btn-primary">로그인 / 회원가입</button>
    </div>
  </div>

  <div id="signedInView" style="display:none;">
    <div class="tab-nav">
      <button class="tab-button active" data-tab="status">📊 상태</button>
      <button class="tab-button" data-tab="controls">⚙️ 기능</button>
    </div>

    <div id="status" class="tab-content active">
      <!-- 로그인했는데 마지막 동기화 성공이 24시간을 넘겼을 때만 뜨는 한 줄. 겁주지 않고
           사실만 말한다 — 그냥 오프라인이었을 수도 있다. 판정은 lib/syncDiagnostics.js. -->
      <div id="syncWarning" class="sync-warning" style="display:none;"></div>

      <div id="streakSection" style="display:none;">
        <div class="streak-hero">
          <div class="streak-number" id="streakNumber">0</div>
          <div class="streak-caption">일 연속 성공 · 최고 <span id="bestStreak">0</span>일</div>
        </div>
        <div class="xp-bar-track"><div class="xp-bar-fill" id="xpBarFill" style="width:0%"></div></div>
        <div class="streak-caption" style="text-align:center; margin-top:4px;">Lv.<span id="levelNumber">1</span> · <span id="xpLabel">0/100 XP</span></div>
      </div>

      <div class="progress-section-center" style="margin-top:12px;">
        <div class="progress-circle-small" id="progressCircle">
          <div class="progress-content">
            <div class="progress-time" id="untilBlock">0분</div>
            <div class="progress-label">차단까지</div>
          </div>
        </div>
      </div>

      <div class="quick-stats-grid">
        <div class="stat-row">
          <span class="stat-label">오늘 사용</span>
          <span class="stat-value" id="usageTime">0분</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">오늘 Shorts</span>
          <span class="stat-value" id="shortsUsage">0분</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">긴급 시청 남음</span>
          <span class="stat-value" id="emergencyCount">0회</span>
        </div>
      </div>

      <div class="status-badges">
        <div class="badge-row">
          <span class="badge-label">지금 소모 중</span>
          <div id="consumingStatus"><span class="status-badge status-inactive">대기 중</span></div>
        </div>
        <div class="badge-row">
          <span class="badge-label">모드</span>
          <div id="modeStatus"><span class="status-badge status-inactive">비활성</span></div>
        </div>
      </div>
    </div>

    <div id="controls" class="tab-content">
      <div class="control-section">
        <h4>🚨 긴급 시청</h4>
        <button id="emergencyButton" class="btn-primary">긴급 시청 요청</button>
      </div>

      <div class="control-section">
        <h4>🎯 집중 모드</h4>
        <div class="input-group">
          <label for="focusModeDelayInput">지연(분):</label>
          <input type="number" id="focusModeDelayInput" min="0" max="120" value="0">
        </div>
        <div class="input-group">
          <label for="focusModeDurationInput">지속(분):</label>
          <input type="number" id="focusModeDurationInput" min="1" max="480" value="30">
        </div>
        <button id="startFocusModeButton" class="btn-primary">집중 모드 시작</button>
        <button id="stopFocusModeButton" class="btn-danger">집중 모드 종료</button>
        <button id="cancelFocusStopButton" class="btn-secondary" style="display:none;">종료 예약 취소</button>
      </div>

      <div class="footer-in-tab">
        <button id="viewDashboardButton" class="btn-secondary">📈 대시보드</button>
        <button id="optionsButton" class="btn-secondary">⚙️ 옵션</button>
      </div>
    </div>
  </div>

  <script src="/popup/popup.js" type="module"></script>
</body>
</html>
