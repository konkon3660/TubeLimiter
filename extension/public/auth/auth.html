<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TubeLimiter 로그인</title>
  <link rel="stylesheet" href="/assets/common.css">
  <link rel="stylesheet" href="/assets/gamify.css">
  <style>
    body { width: auto; min-width: 320px; }
  </style>
</head>
<body>
  <div class="header"><div style="position: relative; z-index: 1;">🎯 TubeLimiter</div></div>

  <div class="auth-box">
    <input type="email" id="email" placeholder="이메일" autocomplete="email" />
    <input type="password" id="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" />
    <div class="auth-error" id="authError"></div>
    <button id="submitButton" class="btn-primary">로그인</button>
    <div class="auth-switch" id="switchModeLink">계정이 없으신가요? 회원가입</div>
  </div>

  <script src="/auth/auth.js" type="module"></script>
</body>
</html>
