<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TensorFlow.js Sandbox</title>
</head>
<body>
  <script src="assets/tf.min.js"></script>
  <script>
    let model = null;

    // Initialize TensorFlow.js
    (async function() {
      console.log('Sandbox: Initializing TensorFlow.js...');

      try {
        await tf.setBackend('wasm');
        console.log('Sandbox: WASM backend set');
      } catch (e) {
        await tf.setBackend('cpu');
        console.log('Sandbox: CPU backend set');
      }

      await tf.ready();
      console.log('Sandbox: TensorFlow.js ready');
    })();

    // Listen for messages from parent
    window.addEventListener('message', async (event) => {
      const { action, data, messageId } = event.data;

      try {
        if (action === 'loadModel') {
          console.log('[Sandbox] Loading model from:', data.modelUrl);
          const modelUrl = data.modelUrl;
          model = await tf.loadGraphModel(modelUrl);
          console.log('[Sandbox] ✓ Model loaded successfully');
          window.parent.postMessage({
            messageId,
            success: true
          }, '*');
        }
        else if (action === 'infer') {
          console.log('[Sandbox] Starting inference...');
          if (!model) {
            throw new Error('Model not loaded');
          }

          const { imageData, width, height } = data;
          console.log('[Sandbox] Image data received:', width, 'x', height, ', data length:', imageData.length);

          console.log('[Sandbox] Creating tensor from image...');
          const tensor = tf.tidy(() => {
            // Create ImageData object with proper structure
            const uint8Array = new Uint8ClampedArray(imageData);
            console.log('[Sandbox] Uint8ClampedArray created, length:', uint8Array.length);

            // Create a proper ImageData object
            const imgData = new ImageData(uint8Array, width, height);
            console.log('[Sandbox] ImageData object created:', width, 'x', height);

            const pixels = tf.browser.fromPixels(imgData);
            // Model expects 0~255 range (EfficientNet preprocessing is inside the model)
            const floatImg = pixels.toFloat();
            return floatImg.expandDims(0);
          });
          console.log('[Sandbox] Tensor created, shape:', tensor.shape);

          let output;
          try {
            console.log('[Sandbox] Running model inference...');
            output = model.execute(tensor);
            const outputTensor = Array.isArray(output) ? output[0] : output;
            console.log('[Sandbox] Model output shape:', outputTensor.shape);

            const values = await outputTensor.data();
            const probStudy = Number(values[0]);
            console.log('[Sandbox] ✓ Inference complete - probStudy:', probStudy.toFixed(4), '(', (probStudy * 100).toFixed(2) + '% study probability)');

            window.parent.postMessage({
              messageId,
              success: true,
              result: probStudy
            }, '*');
          } finally {
            if (Array.isArray(output)) output.forEach(t => t?.dispose?.());
            else output?.dispose?.();
            tensor.dispose();
            console.log('[Sandbox] Tensors disposed');
          }
        }
      } catch (error) {
        console.error('[Sandbox] ✗ Error:', error.message);
        window.parent.postMessage({
          messageId,
          success: false,
          error: error.message
        }, '*');
      }
    });

    // Notify parent that sandbox is ready
    window.parent.postMessage({ action: 'ready' }, '*');
  </script>
</body>
</html>
