name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only one CI run per branch/PR; superseded runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension:
    name: Extension (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          # Relative to the repo root, not to defaults.run.working-directory.
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: false

      # Prettier is a separate gate from ESLint. The tree was brought fully in
      # line with it, so a formatting drift is now a CI failure, not a warning.
      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

  android:
    name: Android (ktlint + unit tests + release build + emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # android/local.properties is gitignored, so AGP resolves the SDK from the
      # ANDROID_HOME the runner exports. compileSdk 37 is newer than the platforms
      # baked into the image, so it gets installed here.
      #
      # This runs BEFORE the JDK step on purpose: sdkmanager is itself a Java tool
      # and runs on whatever JAVA_HOME is current, so installing under the image's
      # default JDK avoids betting that cmdline-tools supports JDK 25. Gradle picks
      # up its own JDK from the next step regardless.
      #
      # The platform is android-37.0, not android-37: platform packages are
      # minor-versioned now (37.0 / 37.1 / 37.2 are separate downloads), and
      # `compileSdk = 37` resolves to 37.0. Asking for a bare android-37 fails
      # with "Failed to find package", which is how the first run died.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      # 25 matches the toolchainVersion pinned in gradle/gradle-daemon-jvm.properties
      # so the daemon does not auto-provision a JDK from foojay. Unrelated to the
      # compile target, which stays at Java 17 bytecode.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew is committed with mode 100644, so it is not executable on checkout.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The three gates stay in separate steps so a red run names the one that
      # broke, and they run cheapest-and-flakiest first: style, then tests, then
      # the slow release build. ktlintCheck hangs off `check`, never off `test`,
      # so running only testDebugUnitTest would skip it entirely.
      - name: Check code style (ktlint)
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # Only the release build runs R8, so app/proguard-rules.pro is unverified
      # without this step. Signing is opt-in via the untracked keystore.properties;
      # with no such file the build succeeds and emits an unsigned APK, so CI
      # needs no secret.
      - name: Build release APK (R8 + resource shrinking)
        run: ./gradlew assembleRelease --no-daemon

      # x86_64 emulator images need KVM, and the runner user cannot open /dev/kvm without
      # this. Without it the emulator silently falls back to a software CPU and times out
      # while booting. Verbatim from the emulator action's README for ubuntu-latest.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The project's first instrumented test (android/app/src/androidTest). It sits AFTER the
      # three gates above because booting an emulator and running a connected test costs
      # minutes, and a style / unit-test / R8 failure should be reported without paying that.
      #
      # `uses:` steps ignore defaults.run.working-directory, hence the action's own
      # working-directory input.
      #
      # api-level 34: inside the app's minSdk 26 .. targetSdk 36 range, and
      # `system-images;android-34;default;x86_64` is present in Google's stable system-image
      # repository (sys-img2-3.xml lists default;x86_64 for API 21-36). `default` is the plain
      # AOSP image - no Play services, so it boots faster, and this suite touches DataStore,
      # not Google APIs. Bumping it towards 36 is a one-line change once the step is proven.
      #
      # continue-on-error: THIS STEP HAS NEVER RUN ON CI. Emulator jobs fail for reasons that
      # have nothing to do with the code under test (system-image download, boot timeout, adb
      # flake, or sdkmanager running under the JDK 25 installed above). Letting that turn the
      # whole Android job red would destroy the signal of the three gates that are proven, so
      # the result is reported without blocking. Drop this flag once a few runs have been
      # green - a permanently non-blocking test is not a gate.
      - name: Run instrumented tests on an emulator (non-blocking, see comment)
        id: instrumented
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          working-directory: android
          # Defaults plus "no camera": the virtual camera is the slowest part of boot and
          # nothing here uses it.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          # The zero-test guard is not paranoia: AGP happily reports BUILD SUCCESSFUL having
          # discovered no tests at all when the androidTest tasks are already up to date
          # (reproduced locally on AGP 9.4 / Gradle 9.7). That would make this gate silently
          # vacuous, which is worse than not having it.
          script: |
            ./gradlew connectedDebugAndroidTest --no-daemon
            results=app/build/outputs/androidTest-results/connected/debug
            if ! grep -q 'tests="[1-9]' $results/*.xml; then
              echo "::error::connectedDebugAndroidTest passed without running any test"
              exit 1
            fi

      # continue-on-error keeps the step (and the job) green either way, so print the real
      # outcome where a reader will see it.
      - name: Report instrumented test outcome
        if: always()
        run: echo "Instrumented tests (non-blocking) -> ${{ steps.instrumented.outcome }}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest
            android/app/build/reports/androidTests/connected
            android/app/build/outputs/androidTest-results/connected
          if-no-files-found: ignore
