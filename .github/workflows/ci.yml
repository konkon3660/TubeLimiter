name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only one CI run per branch/PR; superseded runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension:
    name: Extension (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          # Relative to the repo root, not to defaults.run.working-directory.
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: false

      # Prettier is a separate gate from ESLint. The tree was brought fully in
      # line with it, so a formatting drift is now a CI failure, not a warning.
      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

  android:
    name: Android (ktlint + unit tests + release build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 25 matches the toolchainVersion pinned in gradle/gradle-daemon-jvm.properties
      # so the daemon does not auto-provision a JDK from foojay. Unrelated to the
      # compile target, which stays at Java 17 bytecode.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # android/local.properties is gitignored, so AGP resolves the SDK from the
      # ANDROID_HOME env var that the runner image already exports. compileSdk 37
      # is newer than the platforms preinstalled on the image, so install it here.
      # Matching build-tools are fetched by AGP's own SDK auto-download.
      - name: Install Android SDK platform 37
        working-directory: .
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          echo "Using $sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install "platform-tools" "platforms;android-37"

      # gradlew is committed with mode 100644, so it is not executable on checkout.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The three gates stay in separate steps so a red run names the one that
      # broke, and they run cheapest-and-flakiest first: style, then tests, then
      # the slow release build. ktlintCheck hangs off `check`, never off `test`,
      # so running only testDebugUnitTest would skip it entirely.
      - name: Check code style (ktlint)
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # Only the release build runs R8, so app/proguard-rules.pro is unverified
      # without this step. Signing is opt-in via the untracked keystore.properties;
      # with no such file the build succeeds and emits an unsigned APK, so CI
      # needs no secret.
      - name: Build release APK (R8 + resource shrinking)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
